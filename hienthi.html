<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Màn hình LED — Hội nghị tiếp xúc cử tri</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* =====================================================================
   MÀN HÌNH LED - CHỈ HIỂN THỊ, KHÔNG ĐIỀU KHIỂN
   Dùng cho màn hình LED qua HDMI
===================================================================== */
:root{
    --navy-950:#071A3D; --navy-900:#0E2C6B; --navy-800:#154089;
    --teal:#00ACC1;
    --gold:#E7BE6B; --gold-soft:#F6E4B8; --gold-deep:#B98A34; --gold-bg:#FBF3E1;
    --crimson:#D14134;
    --ink:#F7F5EF; --mist:rgba(247,245,239,0.62); --hair:rgba(231,190,107,0.28);
    --bg:#F2EFE6; --panel:#FFFFFF; --text:#1B2333; --text2:#6B7484; --border:#E4DECB;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:'Be Vietnam Pro', sans-serif; color:var(--ink); background:var(--navy-950);}

/* =====================================================================
   MÀN HÌNH LED - TOÀN MÀN
===================================================================== */
.stage-wrap{
    width:100vw; height:100vh; position:relative; overflow:hidden;
    background:radial-gradient(ellipse 65% 55% at 88% 4%, rgba(231,190,107,0.16), transparent 62%),
               radial-gradient(ellipse 60% 50% at 4% 100%, rgba(0,172,193,0.22), transparent 62%),
               linear-gradient(155deg, var(--navy-950) 0%, var(--navy-900) 48%, var(--navy-800) 78%, #1565C0 130%);
    color:var(--ink);
}
.stage{ display:grid; grid-template-columns:67% 33%; grid-template-rows:79% 21%; width:100%; height:100%; }

/* === VÙNG 1: Đang phát biểu === */
.zone1{ grid-column:1; grid-row:1; padding:2.6vh 3vw 2vh 3.2vw; display:flex; flex-direction:column; min-height:0; border-right:1px solid var(--hair); border-bottom:1px solid var(--hair); }
.z1-eyebrow{ display:flex; align-items:center; gap:.9vw; margin-bottom:1.6vh; }
.live-dot{ width:.9vw; height:.9vw; min-width:10px; min-height:10px; border-radius:50%; background:var(--crimson); animation:pulse 1.6s infinite; }
@keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(209,65,52,0.55);} 70%{box-shadow:0 0 0 14px rgba(209,65,52,0);} 100%{box-shadow:0 0 0 0 rgba(209,65,52,0);} }
.z1-eyebrow span{ font-weight:800; letter-spacing:.28em; text-transform:uppercase; color:var(--gold); font-size:1.15vw; }
.z1-speaker{ display:flex; align-items:baseline; flex-wrap:wrap; gap:0 1.1vw; padding-bottom:1.6vh; margin-bottom:1.8vh; border-bottom:1px solid var(--hair); }
.z1-name{ font-weight:900; font-size:3.5vw; letter-spacing:-.01em; color:var(--ink); }
.z1-unit{ font-weight:600; font-size:1.5vw; color:var(--gold-soft); display:flex; align-items:center; gap:.5vw; }
.z1-body{ flex:1; min-height:0; position:relative; overflow:hidden; }
.z1-scroll{ height:100%; overflow-y:auto; scrollbar-width:none; padding-right:.5vw; }
.z1-scroll::-webkit-scrollbar{ display:none; }
.z1-line{ display:flex; gap:.9vw; align-items:flex-start; font-weight:500; line-height:1.5; color:var(--ink); padding:.55vh 0; }
.z1-line .bullet{ color:var(--gold); flex:none; margin-top:.15em; }
.z1-waiting{ height:100%; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:1vh; color:var(--mist); }
.z1-waiting .big{ font-size:1.8vw; font-weight:700; color:var(--gold-soft); }
.fade-bottom{ position:absolute; left:0; right:0; bottom:0; height:6vh; pointer-events:none; background:linear-gradient(transparent, rgba(10,23,48,0.9)); display:none; }

/* === VÙNG 2: Ý kiến tiếp theo === */
.zone2{ grid-column:1; grid-row:2; display:flex; align-items:center; gap:1.6vw; padding:0 3.2vw; background:linear-gradient(90deg, rgba(231,190,107,0.10), rgba(231,190,107,0.03)); border-right:1px solid var(--hair); }
.z2-icon{ width:3.4vw; height:3.4vw; min-width:38px; min-height:38px; border-radius:50%; border:1.5px solid var(--gold); display:flex; align-items:center; justify-content:center; color:var(--gold); font-size:1.3vw; flex:none; animation:nudge 1.8s ease-in-out infinite; }
@keyframes nudge{ 0%,100%{transform:translateX(0);} 50%{transform:translateX(6px);} }
.z2-text{ font-weight:700; line-height:1.35; color:var(--ink); }
.z2-text b{ color:var(--gold-soft); font-weight:800; }
.z2-empty{ color:var(--mist); font-weight:600; }

/* === VÙNG 3: Danh sách đã duyệt === */
.zone3{ grid-column:2; grid-row:1 / span 2; display:flex; flex-direction:column; min-height:0; padding:2.6vh 1.7vw 2.4vh; background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent 12%); position:relative; }
.z3-head{ display:flex; align-items:center; justify-content:space-between; padding-bottom:1.6vh; margin-bottom:1.4vh; border-bottom:1px solid var(--hair); font-weight:800; letter-spacing:.14em; text-transform:uppercase; font-size:1.05vw; color:var(--gold); }
.z3-count{ font-family:inherit; font-weight:800; font-size:.95vw; background:rgba(231,190,107,0.14); color:var(--gold-soft); border:1px solid var(--hair); border-radius:30px; padding:.3vh 1vw; letter-spacing:0; }
.z3-viewport{ flex:1; min-height:0; overflow:hidden; position:relative; }
.z3-track{ display:flex; flex-direction:column; will-change:transform; }
.z3-row{ display:flex; align-items:center; gap:.9vw; padding:1.15vh .3vw; }
.z3-badge{ flex:none; width:2.4vw; height:2.4vw; min-width:26px; min-height:26px; border-radius:50%; border:1.5px solid var(--gold); display:flex; align-items:center; justify-content:center; font-weight:800; color:var(--gold); font-size:.95vw; }
.z3-row.is-current .z3-badge{ background:var(--gold); color:var(--navy-950); }
.z3-row.is-current{ background:rgba(231,190,107,0.08); border-radius:12px; }
.z3-info{ min-width:0; }
.z3-name{ font-weight:800; color:var(--ink); font-size:1em; }
.z3-unit{ color:var(--mist); font-weight:500; font-size:.86em; display:flex; align-items:center; gap:.4em; margin-top:.15em; }
.z3-divider{ display:flex; align-items:center; justify-content:center; gap:.7vw; padding:1.6vh 0; color:var(--gold); opacity:.55; font-size:.85vw; }
.z3-empty{ color:var(--mist); font-weight:600; padding-top:2vh; }

/* Đồng hồ nổi góc trên phải */
.led-clock{
    position:absolute; top:1.6vh; right:1.9vw; z-index:5; text-align:right;
    background:rgba(6,11,24,0.42); border:1px solid var(--hair); border-radius:14px;
    padding:.8vh 1.1vw; backdrop-filter:blur(3px);
}
.led-clock .lc-time{ font-weight:800; font-size:1.05vw; color:var(--ink); font-variant-numeric:tabular-nums; letter-spacing:.02em; }
.led-clock .lc-date{ font-weight:600; font-size:.68vw; color:var(--gold-soft); margin-top:.1vh; text-transform:capitalize; }

/* Nút toàn màn hình - chỉ hiện khi di chuột */
.fs-btn{
    position:fixed; right:18px; bottom:16px; z-index:50;
    background:rgba(6,11,24,0.55); border:1px solid var(--hair); color:var(--gold-soft);
    border-radius:30px; padding:9px 16px; font-family:inherit; font-size:13px; font-weight:600;
    display:flex; align-items:center; gap:8px; cursor:pointer; opacity:0; transition:opacity .3s;
}
body.show-fs .fs-btn{ opacity:1; }

/* Trạng thái kết nối */
.connection-status{
    position:fixed; bottom:70px; left:50%; transform:translateX(-50%);
    background:rgba(6,11,24,0.7); border:1px solid var(--hair); border-radius:30px;
    padding:6px 18px; color:var(--mist); font-size:11px; font-weight:600;
    display:flex; align-items:center; gap:8px; opacity:0; transition:opacity .4s;
    pointer-events:none; z-index:40;
}
.connection-status.show{ opacity:1; }
.connection-status .dot{ width:8px; height:8px; border-radius:50%; display:inline-block; }
.connection-status .dot.ok{ background:#4CAF50; }
.connection-status .dot.err{ background:var(--crimson); }
</style>
</head>
<body>

<!-- ===================== MÀN HÌNH LED ===================== -->
<div class="stage-wrap">
    <div class="led-clock">
        <div class="lc-time" id="lcTime">--:--:--</div>
        <div class="lc-date" id="lcDate">—</div>
    </div>

    <div class="stage">
        <!-- Vùng 1: Đang phát biểu -->
        <section class="zone1">
            <div class="z1-eyebrow"><span class="live-dot"></span><span>Đang phát biểu</span></div>
            <div id="z1Speaker" class="z1-speaker" style="display:none;">
                <span id="z1Name" class="z1-name"></span>
                <span id="z1Unit" class="z1-unit"></span>
            </div>
            <div class="z1-body">
                <div id="z1Scroll" class="z1-scroll"></div>
                <div class="fade-bottom" id="z1Fade"></div>
            </div>
        </section>

        <!-- Vùng 2: Ý kiến tiếp theo -->
        <section class="zone2">
            <div class="z2-icon"><i class="fas fa-arrow-right"></i></div>
            <div id="z2Text" class="z2-text">Đang tải danh sách…</div>
        </section>

        <!-- Vùng 3: Danh sách đã duyệt -->
        <section class="zone3">
            <div class="z3-head">
                <span><i class="fas fa-list-check"></i>&ensp;Ý kiến đã duyệt</span>
                <span id="z3Count" class="z3-count">0</span>
            </div>
            <div class="z3-viewport">
                <div id="z3Track" class="z3-track"></div>
            </div>
        </section>
    </div>
</div>

<!-- Nút toàn màn hình -->
<button class="fs-btn" id="fsBtn"><i class="fas fa-expand"></i> Toàn màn hình</button>

<!-- Trạng thái kết nối -->
<div class="connection-status" id="connStatus">
    <span class="dot" id="connDot"></span>
    <span id="connText">Đang kết nối…</span>
</div>

<script>
/* =====================================================================
   MÀN HÌNH LED - CHỈ HIỂN THỊ
   Nhận dữ liệu từ localStorage (do dieukhien.html cập nhật)
===================================================================== */
const LED_STATE_KEY = 'led_display_state_v2';
const LED_CHANNEL_NAME = 'led_display_channel_v2';
const WEBAPP_URL = (typeof APP_CONFIG !== 'undefined') ? APP_CONFIG.WEBAPP_URL : '';

let allData = [];
let currentState = { currentId: null };
let isConnecting = true;

// ===================== UTILITY =====================
function escapeHtml(str){ if(!str) return ''; return String(str).replace(/[&<>]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]||m)); }
function pad2(n){ return n<10 ? '0'+n : ''+n; }
function weekdayVi(d){ return ['Chủ Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'][d.getDay()]; }

function ledContentLines(text){ return (text||'').split('\n').map(l=>l.replace(/^•\s*/,'').trim()).filter(Boolean); }

function ledGetApprovedList(data){
    return (data||[]).filter(i=>i.status==='approved' && i.thuTu!=='' && i.thuTu!=null)
        .sort((a,b)=>(parseInt(a.thuTu)||0)-(parseInt(b.thuTu)||0));
}

function ledDeriveView(data, currentId){
    const list = ledGetApprovedList(data);
    let idx=-1; if (currentId) idx = list.findIndex(i=>String(i.id)===String(currentId));
    const current = idx>=0 ? list[idx] : null;
    const next = idx>=0 ? (list[idx+1]||null) : (list[0]||null);
    return { list, current, next, idx };
}

function fmtUnit(item){ return `<i class="fas fa-map-pin"></i> ${escapeHtml(item.khuDanCu||'')}`; }

// ===================== ĐỒNG HỒ =====================
function tickClock(){
    const now = new Date();
    const time = pad2(now.getHours())+':'+pad2(now.getMinutes())+':'+pad2(now.getSeconds());
    const date = weekdayVi(now)+', '+pad2(now.getDate())+'/'+pad2(now.getMonth()+1)+'/'+now.getFullYear();
    const el = document.getElementById('lcTime');
    const el2 = document.getElementById('lcDate');
    if(el) el.textContent = time;
    if(el2) el2.textContent = date;
}
tickClock(); setInterval(tickClock, 1000);

// ===================== RENDER =====================
function render(){
    const view = ledDeriveView(allData, currentState.currentId);
    renderZone1(view);
    renderZone2(view);
    renderZone3(view);
}

function renderZone1(view){
    const speakerBox=document.getElementById('z1Speaker'), scrollBox=document.getElementById('z1Scroll'), fade=document.getElementById('z1Fade');
    if (!view.current){
        speakerBox.style.display='none'; fade.style.display='none';
        scrollBox.innerHTML = `<div class="z1-waiting"><div class="big"><i class="fas fa-hourglass-half"></i>&ensp;Đang chờ mời phát biểu…</div><div>Ban tổ chức sẽ mời ý kiến tiếp theo trong giây lát.</div></div>`;
        return;
    }
    speakerBox.style.display='flex';
    document.getElementById('z1Name').textContent = view.current.hoTen || 'Không tên';
    document.getElementById('z1Unit').innerHTML = fmtUnit(view.current);
    const lines = ledContentLines(view.current.noiDungDuyet || view.current.noiDung || '');
    scrollBox.innerHTML = lines.length
        ? lines.map(l=>`<div class="z1-line"><span class="bullet"><i class="fas fa-diamond"></i></span><span>${escapeHtml(l)}</span></div>`).join('')
        : '<div class="z1-line"><span></span><span style="color:var(--mist)">Không có nội dung chi tiết</span></div>';
    scrollBox.scrollTop = 0;
    requestAnimationFrame(()=>{ fade.style.display = scrollBox.scrollHeight > scrollBox.clientHeight+4 ? 'block':'none'; });
}

function renderZone2(view){
    const box=document.getElementById('z2Text');
    if (!view.next){ box.innerHTML = `<span class="z2-empty">${view.current?'Đây là ý kiến cuối cùng trong danh sách.':'Chưa có ý kiến nào trong danh sách chờ.'}</span>`; return; }
    box.innerHTML = `Tiếp theo: Ông/Bà <b>${escapeHtml(view.next.hoTen||'Không tên')}</b> — ${escapeHtml(view.next.khuDanCu||'')} chuẩn bị.`;
}

let lastTrackKey='';
function renderZone3(view){
    document.getElementById('z3Count').textContent = view.list.length;
    const track=document.getElementById('z3Track');
    if (!view.list.length){ track.style.animation='none'; track.style.transform='none'; track.innerHTML='<div class="z3-empty"><i class="fas fa-inbox"></i>&ensp;Chưa có ý kiến nào được duyệt</div>'; lastTrackKey=''; return; }
    const rowHtml=(item)=>{
        const isCur = view.current && String(item.id)===String(view.current.id);
        return `<div class="z3-row${isCur?' is-current':''}"><div class="z3-badge">${escapeHtml(item.thuTu)}</div><div class="z3-info"><div class="z3-name">${escapeHtml(item.hoTen||'Không tên')}</div><div class="z3-unit">${fmtUnit(item)}</div></div></div>`;
    };
    const dividerHtml = `<div class="z3-divider"><i class="fas fa-diamond"></i><i class="fas fa-diamond"></i><i class="fas fa-diamond"></i></div>`;
    const key = view.list.map(i=>i.id+(view.current?String(view.current.id):'')).join(',');
    if (key === lastTrackKey) return;
    lastTrackKey = key;
    const oneSet = view.list.map(rowHtml).join('') + dividerHtml;
    track.style.animation='none'; track.style.transform='translateY(0)';
    track.innerHTML = oneSet+oneSet;
    requestAnimationFrame(()=>{
        const halfHeight = track.scrollHeight/2;
        const viewportHeight = track.parentElement.clientHeight;
        if (halfHeight <= viewportHeight+4){ track.style.animation='none'; return; }
        const pxPerSecond=26; const duration=Math.max(halfHeight/pxPerSecond,8);
        track.style.setProperty('--scrollDist','-'+halfHeight+'px');
        track.style.animation = `z3scroll ${duration}s linear infinite`;
    });
}

// Thêm style cho animation (chỉ thêm 1 lần)
(function addScrollStyle(){
    const style = document.createElement('style');
    style.textContent = `@keyframes z3scroll { from{transform:translateY(0);} to{transform:translateY(var(--scrollDist,0));} }`;
    document.head.appendChild(style);
})();

// ===================== TỰ ĐỘNG CUỘN VÙNG 1 =====================
(function z1AutoScroll(){
    let dir=1, paused=0;
    function step(){
        const box=document.getElementById('z1Scroll');
        if(!box) return;
        const max=box.scrollHeight-box.clientHeight;
        if (max>6){ if (paused>0) paused--; else { box.scrollTop += dir*0.6; if (box.scrollTop>=max-1){dir=-1;paused=70;} else if (box.scrollTop<=1){dir=1;paused=70;} } }
        requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
})();

// ===================== NHẬN DỮ LIỆU =====================
function updateConnectionStatus(ok, msg){
    const el = document.getElementById('connStatus');
    const dot = document.getElementById('connDot');
    const text = document.getElementById('connText');
    if(!el || !dot || !text) return;
    el.classList.add('show');
    dot.className = 'dot ' + (ok ? 'ok' : 'err');
    text.textContent = msg || (ok ? 'Đã kết nối' : 'Mất kết nối');
    if(ok) setTimeout(()=>{ el.classList.remove('show'); }, 3000);
}

// Lấy dữ liệu từ API
async function fetchData(){
    if(!WEBAPP_URL) return null;
    try{
        const res = await fetch(WEBAPP_URL + '?action=get&t=' + Date.now());
        const json = await res.json();
        if (json && typeof json === 'object'){
            if (Array.isArray(json)) return json;
            if (json.data && Array.isArray(json.data)) return json.data;
        }
        return null;
    }catch(e){ return null; }
}

// Lắng nghe thay đổi từ localStorage (do dieukhien.html cập nhật)
function listenStateChange(){
    window.addEventListener('storage', (e)=>{
        if (e.key === LED_STATE_KEY){
            try{
                const newState = JSON.parse(e.newValue);
                if(newState && typeof newState === 'object'){
                    currentState = newState;
                    render();
                }
            }catch(err){}
        }
    });
    
    // BroadcastChannel cho đồng bộ realtime
    if('BroadcastChannel' in window){
        try{
            const ch = new BroadcastChannel(LED_CHANNEL_NAME);
            ch.onmessage = (e)=>{
                if(e.data && e.data.type === 'state' && e.data.state){
                    currentState = e.data.state;
                    render();
                }
            };
        }catch(e){}
    }
}

// Tải dữ liệu và render
async function refreshAndRender(){
    const fresh = await fetchData();
    if(fresh !== null){
        allData = fresh;
        updateConnectionStatus(true, 'Đã cập nhật');
        render();
    } else {
        updateConnectionStatus(false, 'Mất kết nối máy chủ');
    }
}

// ===================== TOÀN MÀN HÌNH =====================
document.getElementById('fsBtn').addEventListener('click', ()=>{
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.().catch(()=>{});
    } else {
        document.exitFullscreen?.();
    }
});

let hideTimer;
document.addEventListener('mousemove', ()=>{
    document.body.classList.add('show-fs');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(()=>document.body.classList.remove('show-fs'), 2200);
});

// ===================== KHỞI ĐỘNG =====================
// Đọc state từ localStorage
try{
    const saved = localStorage.getItem(LED_STATE_KEY);
    if(saved){
        const parsed = JSON.parse(saved);
        if(parsed && typeof parsed === 'object') currentState = parsed;
    }
}catch(e){}

// Lắng nghe thay đổi
listenStateChange();

// Load dữ liệu lần đầu
refreshAndRender();

// Tự động refresh mỗi 5 giây
setInterval(refreshAndRender, 5000);

// Xử lý khi tab được focus lại
document.addEventListener('visibilitychange', ()=>{
    if(!document.hidden) refreshAndRender();
});

// Nếu đang ở chế độ fullscreen, ẩn status
document.addEventListener('fullscreenchange', ()=>{
    const status = document.getElementById('connStatus');
    if(status){
        if(document.fullscreenElement){
            status.style.opacity = '0';
        } else {
            status.style.opacity = '1';
        }
    }
});
</script>
</body>
</html>
